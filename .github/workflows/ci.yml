# Comprobaciones de Arca. El orden importa: lint y tipos son rápidos y fallan
# pronto; el build es lo más lento y va al final.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Los agentes de Codex se generan desde .claude/agents/ y los .toml están
      # fuera de git, así que aquí no hay nada con lo que comparar: `agentes:check`
      # fallaba siempre en un checkout limpio. Lo que sí vale la pena comprobar es
      # que cada agente se pueda generar y esté bien declarado, y eso lo hace el
      # propio generador, que sale con error si a un .md le falta el frontmatter
      # o la description. El desfase es un problema local y se ve con
      # `npm run agentes:check` en la máquina.
      - run: npm run agentes:sync
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
